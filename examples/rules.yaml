rules:
  - id: adult-discount
    priority: 10
    conditions:
      all:
        - field: age
          op: ge
          value: 18
        - field: member
          op: eq
          value: true
    actions:
      - set: {field: discount, value: 0.2}

  - id: senior-discount
    priority: 20
    conditions:
      field: age
      op: ge
      value: 65
    actions:
      - set: {field: discount, value: 0.3}

  - id: apply-free-shipping
    priority: 5
    conditions:
      any:
        - field: discount
          op: ge
          value: 0.3
        - field: tags
          op: contains
          value: vip
    actions:
      - set: {field: free_shipping, value: true}
